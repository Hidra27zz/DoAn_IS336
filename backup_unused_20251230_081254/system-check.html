<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Check</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WMS System Status Check</h1>
    
    <div class="status info">
      <strong>System Check Results:</strong>
    </div>
    
    <div id="results"></div>
    
    <button onclick="runSystemCheck()">Run System Check</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <button onclick="window.open('/', '_blank')">Open Main App</button>
    
    <h3>Console Output:</h3>
    <pre id="console-output"></pre>
  </div>
  
  <script>
    let consoleOutput = '';
    
    // Capture console logs
    const originalLog = console.log;
    const originalError = console.error;
    
    console.log = function(...args) {
      consoleOutput += 'LOG: ' + args.join(' ') + '\n';
      updateConsoleOutput();
      originalLog.apply(console, args);
    };
    
    console.error = function(...args) {
      consoleOutput += 'ERROR: ' + args.join(' ') + '\n';
      updateConsoleOutput();
      originalError.apply(console, args);
    };
    
    function updateConsoleOutput() {
      document.getElementById('console-output').textContent = consoleOutput;
    }
    
    async function runSystemCheck() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="status info">Running system check...</div>';
      
      let html = '';
      
      // Check server connection
      try {
        const response = await fetch('/api/health');
        if (response.ok) {
          html += '<div class="status success">Server is running</div>';
        } else {
          html += '<div class="status error">Server responded with error</div>';
        }
      } catch (error) {
        html += '<div class="status error">Cannot connect to server</div>';
      }
      
      // Check authentication endpoint
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'test', password: 'test' })
        });
        const result = await response.json();
        if (response.ok || result.error) {
          html += '<div class="status success">Authentication endpoint working</div>';
        } else {
          html += '<div class="status error">Authentication endpoint error</div>';
        }
      } catch (error) {
        html += '<div class="status error">Authentication endpoint failed: ' + error.message + '</div>';
      }
      
      // Check database connection
      try {
        const response = await fetch('/api/inventory?limit=1');
        if (response.ok) {
          html += '<div class="status success">Database connection working</div>';
        } else {
          html += '<div class="status error">Database connection failed</div>';
        }
      } catch (error) {
        html += '<div class="status error">Database connection error: ' + error.message + '</div>';
      }
      
      // Check metrics calculation
      try {
        const response = await fetch('/api/metrics/real-time');
        const result = await response.json();
        if (result.success) {
          html += '<div class="status success">Metrics calculation working</div>';
          html += '<div class="status info">Total Products: ' + (result.data.totalProducts || 0) + '</div>';
          html += '<div class="status info">Space Utilization: ' + (result.data.spaceUtilization || 0) + '%</div>';
        } else {
          html += '<div class="status error">Metrics calculation failed</div>';
        }
      } catch (error) {
        html += '<div class="status error">Metrics endpoint error: ' + error.message + '</div>';
      }
      
      // Check local storage
      const token = localStorage.getItem('authToken');
      const user = localStorage.getItem('currentUser');
      
      if (token && user) {
        html += '<div class="status success">User session found in storage</div>';
        try {
          const userData = JSON.parse(user);
          html += '<div class="status info">Logged in as: ' + userData.username + ' (' + userData.role + ')</div>';
        } catch (e) {
          html += '<div class="status error">Invalid user data in storage</div>';
        }
      } else {
        html += '<div class="status info">No user session found</div>';
      }
      
      results.innerHTML = html;
    }
    
    async function testLogin() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="status info">Testing login with admin/admin123...</div>';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'admin', password: 'admin123' })
        });
        
        const result = await response.json();
        
        if (result.success) {
          localStorage.setItem('authToken', result.token);
          localStorage.setItem('currentUser', JSON.stringify(result.user));
          
          results.innerHTML = `
            <div class="status success">Login successful!</div>
            <div class="status info">User: ${result.user.username} (${result.user.role})</div>
            <div class="status info">Token stored in localStorage</div>
            <div class="status info">You can now open the main app and should be logged in automatically.</div>
          `;
        } else {
          results.innerHTML = `
            <div class="status error">Login failed: ${result.error}</div>
          `;
        }
      } catch (error) {
        results.innerHTML = `
          <div class="status error">Login error: ${error.message}</div>
        `;
      }
    }
    
    function clearStorage() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      document.getElementById('results').innerHTML = '<div class="status info">Storage cleared</div>';
    }
    
    // Run initial check
    runSystemCheck();
  </script>
</body>
</html>
