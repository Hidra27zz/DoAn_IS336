<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Debug</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .chart-container { width: 400px; height: 300px; margin: 20px; border: 1px solid #ccc; }
    .debug-info { background: #f0f0f0; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Chart Debug Page</h1>
  
  <div class="debug-info">
    <h3>Debug Information</h3>
    <div id="debug-output"></div>
  </div>
  
  <div class="chart-container">
    <h3>Test Chart</h3>
    <canvas id="test-chart"></canvas>
  </div>
  
  <button onclick="testAPI()">Test API</button>
  <button onclick="testChart()">Test Chart</button>
  
  <script>
    function log(message) {
      const output = document.getElementById('debug-output');
      output.innerHTML += '<p>' + message + '</p>';
      console.log(message);
    }
    
    // Test Chart.js availability
    document.addEventListener('DOMContentLoaded', function() {
      log('DOM loaded');
      
      if (typeof Chart !== 'undefined') {
        log('✅ Chart.js loaded, version: ' + (Chart.version || 'Unknown'));
      } else {
        log('❌ Chart.js not loaded');
      }
      
      const canvas = document.getElementById('test-chart');
      if (canvas) {
        log('✅ Canvas element found');
      } else {
        log('❌ Canvas element not found');
      }
    });
    
    async function testAPI() {
      try {
        log('Testing login...');
        const loginResponse = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'admin', password: 'admin123' })
        });
        
        const loginResult = await loginResponse.json();
        if (loginResult.token) {
          log('✅ Login successful');
          
          // Test inventory API
          const inventoryResponse = await fetch('/api/inventory/summary', {
            headers: { 'Authorization': `Bearer ${loginResult.token}` }
          });
          
          const inventoryData = await inventoryResponse.json();
          log('✅ Inventory API response: ' + JSON.stringify(inventoryData).substring(0, 100) + '...');
          
          // Test orders API
          const ordersResponse = await fetch('/api/orders/stats/summary', {
            headers: { 'Authorization': `Bearer ${loginResult.token}` }
          });
          
          const ordersData = await ordersResponse.json();
          log('✅ Orders API response: ' + JSON.stringify(ordersData));
          
          // Try to create chart with real data
          createChartWithData(inventoryData, ordersData);
          
        } else {
          log('❌ Login failed: ' + JSON.stringify(loginResult));
        }
        
      } catch (error) {
        log('❌ API test failed: ' + error.message);
      }
    }
    
    function testChart() {
      try {
        log('Creating test chart...');
        
        const ctx = document.getElementById('test-chart');
        if (!ctx) {
          log('❌ Canvas not found');
          return;
        }
        
        const chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Zone A', 'Zone B', 'Zone C'],
            datasets: [{
              label: 'Test Data',
              data: [100, 200, 150],
              backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe']
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: true } }
          }
        });
        
        log('✅ Test chart created successfully');
        
      } catch (error) {
        log('❌ Chart creation failed: ' + error.message);
        log('Error stack: ' + error.stack);
      }
    }
    
    function createChartWithData(inventoryData, ordersData) {
      try {
        log('Creating chart with real data...');
        
        if (!inventoryData.by_zone) {
          log('❌ No zone data in inventory response');
          return;
        }
        
        const zones = Object.keys(inventoryData.by_zone);
        const quantities = zones.map(z => inventoryData.by_zone[z].total_quantity);
        
        log('Zone data: ' + zones.join(', '));
        log('Quantities: ' + quantities.join(', '));
        
        const ctx = document.getElementById('test-chart');
        const chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: zones.map(z => `Zone ${z}`),
            datasets: [{
              label: 'Quantity',
              data: quantities,
              backgroundColor: '#2563eb'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
              legend: { display: false },
              title: {
                display: true,
                text: 'Real Inventory Data by Zone'
              }
            }
          }
        });
        
        log('✅ Real data chart created successfully');
        
      } catch (error) {
        log('❌ Real data chart failed: ' + error.message);
      }
    }
  </script>
</body>
</html>
