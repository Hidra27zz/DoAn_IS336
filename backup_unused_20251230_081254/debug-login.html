<!DOCTYPE html>
<html>
<head>
    <title>Debug Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="debug-info" id="debug-info">
        Debug Info:<br>
        Login Screen: <span id="login-status">-</span><br>
        Dashboard Screen: <span id="dashboard-status">-</span><br>
        Auth Token: <span id="token-status">-</span><br>
        Current User: <span id="user-status">-</span>
    </div>

    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <div class="login-header">
                    <h1>Warehouse Management System</h1>
                    <p>AI-Powered Optimization</p>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" value="admin" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" value="admin123" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p id="login-error" class="error-message"></p>
                </form>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="dashboard-screen" class="screen">
            <nav class="sidebar">
                <div class="sidebar-header">
                    <h2>WMS</h2>
                    <span class="user-role" id="user-role"></span>
                </div>
            </nav>
            <main class="main-content">
                <h1>Dashboard Content</h1>
                <p>If you see this, the dashboard is working!</p>
            </main>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let authToken = null;
        let currentUser = null;

        function updateDebugInfo() {
            document.getElementById('login-status').textContent = 
                document.getElementById('login-screen').classList.contains('active') ? 'ACTIVE' : 'HIDDEN';
            document.getElementById('dashboard-status').textContent = 
                document.getElementById('dashboard-screen').classList.contains('active') ? 'ACTIVE' : 'HIDDEN';
            document.getElementById('token-status').textContent = authToken ? 'EXISTS' : 'NULL';
            document.getElementById('user-status').textContent = currentUser ? currentUser.username : 'NULL';
        }

        function showLoginScreen() {
            console.log('Showing login screen');
            document.getElementById('login-screen').classList.add('active');
            document.getElementById('dashboard-screen').classList.remove('active');
            updateDebugInfo();
        }

        function showDashboard() {
            console.log('Showing dashboard');
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('dashboard-screen').classList.add('active');
            document.getElementById('user-role').textContent = currentUser.role;
            updateDebugInfo();
        }

        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Login form submitted');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            
            try {
                console.log('Sending login request...');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (response.ok) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    errorEl.textContent = '';
                    
                    console.log('Login successful, showing dashboard...');
                    showDashboard();
                } else {
                    console.log('Login failed:', data.error);
                    errorEl.textContent = data.error || 'Login failed';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorEl.textContent = 'Connection error. Please try again.';
            }
        });

        // Initialize
        updateDebugInfo();
        setInterval(updateDebugInfo, 1000);
    </script>
</body>
</html>
