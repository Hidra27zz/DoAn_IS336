<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .form-group { margin: 10px 0; }
    input { padding: 8px; margin: 5px; width: 200px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    .result { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Login Test</h1>
  <form id="test-login-form">
    <div class="form-group">
      <label>Username:</label>
      <input type="text" id="test-username" value="admin" required>
    </div>
    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="test-password" value="admin123" required>
    </div>
    <button type="submit">Test Login</button>
  </form>
  
  <div id="test-result" class="result"></div>
  
  <script>
    document.getElementById('test-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('test-username').value;
      const password = document.getElementById('test-password').value;
      const resultDiv = document.getElementById('test-result');
      
      resultDiv.innerHTML = 'Testing login...';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          resultDiv.innerHTML = `
            <h3>Login Successful!</h3>
            <p>Token: ${result.token.substring(0, 20)}...</p>
            <p>User: ${result.user.username} (${result.user.role})</p>
            <p>Now testing dashboard functions...</p>
          `;
          
          // Test dashboard API calls
          const inventoryResponse = await fetch('/api/inventory?limit=5', {
            headers: { 'Authorization': `Bearer ${result.token}` }
          });
          const inventoryData = await inventoryResponse.json();
          
          resultDiv.innerHTML += `
            <h4>Dashboard API Test:</h4>
            <p>Inventory API: ${inventoryData.inventory ? 'Working' : 'Failed'}</p>
            <p>Items found: ${inventoryData.inventory?.length || 0}</p>
          `;
          
        } else {
          resultDiv.innerHTML = `
            <h3>Login Failed</h3>
            <p>Error: ${result.error}</p>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <h3>Error</h3>
          <p>${error.message}</p>
        `;
      }
    });
  </script>
</body>
</html>
