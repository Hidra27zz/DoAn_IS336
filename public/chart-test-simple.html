<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chart Test</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .chart-container { width: 400px; height: 300px; margin: 20px; border: 1px solid #ccc; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>Chart Test - Real Data</h1>
  
  <div id="status"></div>
  
  <div class="chart-container">
    <h3>Inventory by Zone</h3>
    <canvas id="inventory-chart"></canvas>
  </div>
  
  <div class="chart-container">
    <h3>Order Status</h3>
    <canvas id="orders-chart"></canvas>
  </div>
  
  <button onclick="runTest()">Run Test</button>
  <button onclick="clearCharts()">Clear Charts</button>
  
  <script>
    let charts = {};
    
    function addStatus(message, type = 'info') {
      const status = document.getElementById('status');
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = new Date().toLocaleTimeString() + ': ' + message;
      status.appendChild(div);
      console.log(message);
    }
    
    async function runTest() {
      addStatus('Starting chart test...', 'info');
      
      // Check Chart.js
      if (typeof Chart === 'undefined') {
        addStatus('Chart.js not loaded!', 'error');
        return;
      }
      addStatus('Chart.js loaded successfully', 'success');
      
      try {
        // Login first
        addStatus('Logging in...', 'info');
        const loginResponse = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'admin', password: 'admin123' })
        });
        
        const loginResult = await loginResponse.json();
        if (!loginResult.token) {
          addStatus('Login failed: ' + (loginResult.error || 'Unknown error'), 'error');
          return;
        }
        addStatus('Login successful', 'success');
        
        // Get inventory data
        addStatus('Fetching inventory data...', 'info');
        const inventoryResponse = await fetch('/api/inventory/summary', {
          headers: { 'Authorization': `Bearer ${loginResult.token}` }
        });
        
        const inventoryData = await inventoryResponse.json();
        if (!inventoryData.by_zone) {
          addStatus('No inventory zone data received', 'error');
          return;
        }
        addStatus(`Inventory data received: ${Object.keys(inventoryData.by_zone).length} zones`, 'success');
        
        // Get orders data
        addStatus('Fetching orders data...', 'info');
        const ordersResponse = await fetch('/api/orders/stats/summary', {
          headers: { 'Authorization': `Bearer ${loginResult.token}` }
        });
        
        const ordersData = await ordersResponse.json();
        addStatus(`Orders data received: ${ordersData.total_orders || 0} total orders`, 'success');
        
        // Create inventory chart
        addStatus('Creating inventory chart...', 'info');
        createInventoryChart(inventoryData);
        
        // Create orders chart
        addStatus('Creating orders chart...', 'info');
        createOrdersChart(ordersData);
        
        addStatus('All charts created successfully!', 'success');
        
      } catch (error) {
        addStatus('Test failed: ' + error.message, 'error');
        console.error('Test error:', error);
      }
    }
    
    function createInventoryChart(data) {
      const ctx = document.getElementById('inventory-chart');
      
      // Clear existing chart
      if (charts.inventory) {
        charts.inventory.destroy();
      }
      
      const zones = Object.keys(data.by_zone);
      const quantities = zones.map(z => data.by_zone[z].total_quantity);
      
      charts.inventory = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: zones.map(z => `Zone ${z}`),
          datasets: [{
            label: 'Quantity',
            data: quantities,
            backgroundColor: [
              '#2563eb', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', 
              '#06b6d4', '#84cc16', '#f97316', '#ec4899', '#6366f1'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { display: false },
            title: {
              display: true,
              text: 'Inventory Distribution by Zone'
            }
          }
        }
      });
      
      addStatus(`Inventory chart created with ${zones.length} zones`, 'success');
    }
    
    function createOrdersChart(data) {
      const ctx = document.getElementById('orders-chart');
      
      // Clear existing chart
      if (charts.orders) {
        charts.orders.destroy();
      }
      
      const orderData = [
        data.pending || 0,
        data.assigned || 0,
        data.picking || 0,
        data.picked || 0,
        data.shipped || 0
      ];
      
      charts.orders = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pending', 'Assigned', 'Picking', 'Picked', 'Shipped'],
          datasets: [{
            data: orderData,
            backgroundColor: ['#f59e0b', '#3b82f6', '#8b5cf6', '#22c55e', '#10b981']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { position: 'bottom' },
            title: {
              display: true,
              text: 'Order Status Distribution'
            }
          }
        }
      });
      
      addStatus(`Orders chart created with ${data.total_orders || 0} total orders`, 'success');
    }
    
    function clearCharts() {
      Object.values(charts).forEach(chart => {
        if (chart) chart.destroy();
      });
      charts = {};
      addStatus('All charts cleared', 'info');
    }
    
    // Auto-run test on page load
    document.addEventListener('DOMContentLoaded', function() {
      addStatus('Page loaded, ready to test', 'info');
    });
  </script>
</body>
</html>
